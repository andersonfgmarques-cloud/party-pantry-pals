name: Deploy production unchanged + Festou preview

on:
  push:
    branches: ["main", "feat/festou-multi-event-foundation"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install production dependencies
        working-directory: production
        run: bun install --frozen-lockfile
      - name: Build current production site from main
        working-directory: production
        run: bun run build
        env:
          GITHUB_ACTIONS: "true"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Checkout Festou preview source
        uses: actions/checkout@v4
        with:
          ref: feat/festou-multi-event-foundation
          path: preview-source
      - name: Add isolated preview under /preview/
        run: |
          mkdir -p production/dist/preview
          cp preview-source/public/preview/index.html production/dist/preview/index.html
          touch production/dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production plus isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
