name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Type check
        run: bun run typecheck
      - name: Production build
        run: bun run build
      - name: Build isolated demo bundle
        run: VITE_DEMO_BUILD=1 bun run build
      - name: Upload isolated demo preview
        uses: actions/upload-artifact@v4
        with:
          name: festou-demo-preview
          path: dist/
          if-no-files-found: error
          retention-days: 14
